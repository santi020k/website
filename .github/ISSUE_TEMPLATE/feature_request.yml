name: Suggest an improvement
description: Propose a useful improvement to the website or reading experience.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the reader's need and the affected page. Reports are public; omit personal information.
        Requests about a separate product belong in that product's repository.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Explain the task, problem, or missing information and who benefits.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Relevant page
      description: Optional public URL or website section.
  - type: textarea
    id: solution
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Public references or a simpler approach, if available.
