version: 2

updates:
  # Dependabot rewrites pnpm catalog references into lockfiles that fail frozen
  # installs, so version updates come from Renovate (renovate.json) instead.
  # A zero version-PR limit keeps security update pull requests enabled.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: '06:15'
      timezone: America/Bogota
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(deps)
