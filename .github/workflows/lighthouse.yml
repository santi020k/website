name: Lighthouse CI (Manual)
# Lighthouse now runs automatically as part of the CI workflow (build.yml).
# This workflow is kept for manual one-off audits only.

'on':
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build Site
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Audit Performance with Lighthouse
        run: pnpm exec lhci autorun --config=.lighthouserc.json
