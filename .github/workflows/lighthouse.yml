name: Lighthouse CI (Manual)
# Lighthouse now runs automatically as part of the CI workflow (build.yml).
# This workflow is kept for manual one-off audits only.

on:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build Site
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Audit Performance with Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./.lighthouserc.json"
