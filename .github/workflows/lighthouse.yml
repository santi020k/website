name: Lighthouse CI (Manual)
# Temporary diagnostics branch: traces the article's CI-only Total Blocking Time.

'on':
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version: "24"
      - name: Download the production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build
          path: dist/
          run-id: 41691380461
          github-token: ${{ github.token }}
      - name: Trace the article
        run: bash scripts/tmp-lighthouse-trace.sh
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-trace
          path: /tmp/lh-out/
          if-no-files-found: ignore
          retention-days: 3
