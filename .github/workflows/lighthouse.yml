name: Lighthouse CI (Manual)
# Lighthouse now runs automatically as part of the CI workflow (build.yml).
# This workflow is kept for manual one-off audits only.

'on':
  workflow_dispatch: {}

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version: "24"
      - name: Build Site
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Audit Performance with Lighthouse
        run: pnpm exec lhci autorun --config=.lighthouserc.json
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-diagnostics
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
