name: Lighthouse CI (Manual)
# Lighthouse now runs automatically as part of the CI workflow (build.yml).
# This workflow is kept for manual one-off audits only.

'on':
  workflow_dispatch: {}

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # The full build takes about 22 minutes and the 36 audit runs about 10 more.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@208015ed792b633a1455201ae2f3dd8d9b7eb96c # v1.4.0
        with:
          node-version: "24"
      - name: Build Site
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Audit Performance with Lighthouse
        run: pnpm exec lhci autorun --config=.lighthouserc.json
      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-diagnostics
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
