name: Astro Doctor

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: astro-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  astro-doctor:
    name: Astro Doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: santi020k/astro-doctor@v1
        with:
          # Fork and Dependabot PRs receive a read-only token and cannot post comments.
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          diff-only: 'true'
          fail-on: 'warning'
