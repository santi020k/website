name: Security Audit

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Run pnpm audit
        # CVE-2026-14257 is limited to repository-controlled glob patterns in
        # legacy developer CLIs. The exception is documented in
        # pnpm-workspace.yaml because forcing brace-expansion v5 breaks them.
        run: pnpm run audit
