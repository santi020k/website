name: CodeQL

on:
  # Pull requests are scanned only when they change code CodeQL analyzes or this workflow.
  # Every push to main is scanned, so the default branch always has a current baseline.
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.cts'
      - '**/*.tsx'
      - '**/*.astro'
      - '**/*.html'
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/codeql.yml
  push:
    branches: [main]
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript

      - name: Analyze source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript
