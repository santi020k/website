name: Release

'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v4.0.0)
        required: true
        type: string
      prerelease:
        description: Mark this as a pre-release
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'santi020k'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the production commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must use semantic versioning, for example v4.0.0."
            exit 1
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes --fail-on-no-commits)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
