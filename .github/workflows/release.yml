name: Release

'on':
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or release
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'santi020k'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the Changesets release pull request
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          commit: "chore(release): version website"
          title: "chore(release): version website"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          HUSKY: 0

      - name: Detect a merged version bump
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version=$(node -p "require('./package.json').version")
          previous_version="$current_version"

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            previous_version=$(git show "${BEFORE_SHA}:package.json" |
              node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version))")
          fi

          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version must use semantic versioning."
            exit 1
          fi

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Fxq "## ${current_version}" CHANGELOG.md; then
            echo "::error::Version ${current_version} has no matching CHANGELOG.md entry. Use the Changesets release pull request."
            exit 1
          fi

          echo "Detected version bump: ${previous_version} -> ${current_version}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"

      - name: Create version tag and GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            tagged_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$tagged_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_TAG} already points to ${tagged_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists. Skipping."
            exit 0
          fi

          awk -v heading="## ${RELEASE_VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ -s release-notes.md ]]; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
