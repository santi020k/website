name: Release

'on':
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or GitHub Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.repository_owner == 'santi020k'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify dependency security
        run: pnpm run audit
      - name: Create release pull request or GitHub Release
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          publish: pnpm run release
          commit: "chore: release website"
          title: "chore: release website"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
