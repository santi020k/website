name: CI

on:
  pull_request:
    branches: [main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  impact:
    name: Quality v2 impact shadow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out committed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Quality CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh -o "$RUNNER_TEMP/install-quality.sh"
          sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality "v$(cat .quality-version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Set up Node.js for impact regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Test conservative impact selection
        run: node --test scripts/js/quality-impact.node-test.mjs
      - name: Plan committed revision without replacing required checks
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "$CI_BASE_SHA" || "$CI_HEAD_REF" == release/* || "$CI_HEAD_REF" == changeset-release/* ]]; then
            quality impact plan --full --format json > quality-impact-plan.json
          else
            quality impact plan --base "$CI_BASE_SHA" --head HEAD --comparison merge-base --format json > quality-impact-plan.json
          fi
      - name: Upload shadow plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-impact-plan-${{ github.sha }}-${{ github.run_attempt }}
          path: quality-impact-plan.json
          if-no-files-found: error
          retention-days: 7

  static:
    name: Static checks
    runs-on: ubuntu-latest
    # Lint, type checks and tests cover the current site, four archives and the motion studio.
    timeout-minutes: 45
    steps:
      # A blobless clone keeps the full commit graph for change detection without
      # downloading every historical image; Git fetches older file contents on demand.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect build-affecting changes
        id: changes
        run: node scripts/js/ci-scope.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Run Astro Doctor on the changed code
        if: steps.changes.outputs.full == 'true' && github.event_name == 'pull_request'
        uses: santi020k/astro-doctor@69a859a26a22de46a0da6b71cd1e894434d80c1f # v1
        with:
          comment: 'false'
          diff-only: 'true'
          fail-on: warning

      - name: Set up pnpm workspace
        if: steps.changes.outputs.checks == 'true'
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 24.x
          # Archive and motion lint and type-check results are Turbo tasks; an unchanged
          # app replays its recorded result instead of running again.
          task-cache-path: .turbo/cache
          task-cache-key: static

      - name: Check documentation
        if: steps.changes.outputs.checks == 'true' && steps.changes.outputs.full != 'true'
        run: pnpm run test:ci && pnpm run spellcheck && pnpm run lint:md

      - name: Run static checks and unit tests
        if: steps.changes.outputs.full == 'true'
        run: pnpm run ci:check
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Catch accidental local-time getters and parsing behind UTC.
          TZ: America/Bogota

      - name: Audit dependencies
        if: steps.changes.outputs.full == 'true'
        run: pnpm run audit

  # The build runs beside the static checks; browser tests and Lighthouse wait only for it.
  build:
    name: Production build
    runs-on: ubuntu-latest
    # The assembled build compiles the current site, four archives and the motion studio.
    timeout-minutes: 45
    outputs:
      full: ${{ steps.changes.outputs.full }}
    steps:
      # Page dates come from Git history, so keep the full commit graph without old blobs.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Detect build-affecting changes
        id: changes
        run: node scripts/js/ci-scope.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm workspace
        if: steps.changes.outputs.full == 'true'
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 24.x

      - name: Restore archive task cache
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .turbo/cache
          key: archive-tasks-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            archive-tasks-v1-${{ runner.os }}-${{ runner.arch }}-

      # OG images and .og-cache.json are tracked, so builds use the checked-out
      # copies. Restoring an Actions cache would overwrite the pull request's files.
      - name: Cache Astro image transformations
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules/.astro
            apps/*/node_modules/.astro
          key: >-
            astro-images-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.*', 'src/assets/**', 'apps/*/astro.config.*', 'apps/*/src/assets/**', 'packages/website-history/**') }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-

      - name: Build production site
        if: steps.changes.outputs.full == 'true'
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
          # Browser tests must also exercise builds ahead of UTC.
          TZ: Asia/Tokyo

      - name: Upload the production build
        if: steps.changes.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # Shards split the stable Chromium suite by test so each job takes a similar share and
  # stays well inside its timeout. Every shard previews the same build the build job produced.
  browser:
    name: Browser tests (${{ matrix.shard }}/6)
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 24.x

      - name: Download the production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build
          path: dist/

      # The stable suite sets PW_CHROMIUM_CHANNEL=chrome, so Playwright drives the Google Chrome
      # that the runner image already provides. Downloading Playwright's Chromium build and its
      # system packages added about a minute to every shard without being used.
      - name: Use the runner's Google Chrome
        run: |
          if [[ -x /opt/google/chrome/chrome ]]; then
            /opt/google/chrome/chrome --version
          else
            pnpm exec playwright install --with-deps chrome
          fi

      - name: Run stable browser tests
        run: pnpm run test:e2e:ci:stable --shard=${{ matrix.shard }}/6
        env:
          # Standard public runners have four vCPUs; the preview server shares them.
          PW_WORKERS: '2'

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Assertions keep each route's best run. Release pull requests and manual runs audit every
    # route three times; other pull requests audit once, so a noisy run can fail them. Rerun the
    # job, or raise LIGHTHOUSE_PULL_REQUEST_RUNS, if that proves too sensitive.
    timeout-minutes: 30
    env:
      LIGHTHOUSE_PULL_REQUEST_RUNS: '1'
      LIGHTHOUSE_RELEASE_RUNS: '3'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 24.x

      - name: Download the production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build
          path: dist/

      - name: Run Lighthouse assertions
        env:
          CI_HEAD_REF: ${{ github.head_ref }}
        run: |
          runs="$LIGHTHOUSE_RELEASE_RUNS"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$CI_HEAD_REF" != release/* && "$CI_HEAD_REF" != changeset-release/* ]]; then
            runs="$LIGHTHOUSE_PULL_REQUEST_RUNS"
          fi
          echo "Lighthouse runs per route: $runs"
          pnpm exec lhci autorun --config=.lighthouserc.json --collect.numberOfRuns="$runs"

      - name: Upload Lighthouse diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-diagnostics
          path: .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  # Branch protection requires this job. It passes only when every job the change
  # selected succeeded; documentation-only changes skip the build-dependent jobs.
  quality:
    name: Quality gate
    needs: [impact, static, build, browser, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
          FULL_BUILD: ${{ needs.build.outputs.full }}
        run: |
          status=0
          for job in "impact:$IMPACT_RESULT" "static:$STATIC_RESULT" "build:$BUILD_RESULT" "browser:$BROWSER_RESULT" "lighthouse:$LIGHTHOUSE_RESULT"; do
            result=${job#*:}
            echo "${job%%:*}: $result"
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "::error::The ${job%%:*} job finished with: $result"
              status=1
            fi
          done
          if [[ "$IMPACT_RESULT" != success || "$STATIC_RESULT" != success || "$BUILD_RESULT" != success ]]; then
            echo "::error::Impact planning, static checks and the build must succeed."
            status=1
          fi
          if [[ "$FULL_BUILD" != true && "$FULL_BUILD" != false ]]; then
            echo "::error::The build selection output is missing or invalid."
            status=1
          elif [[ "$FULL_BUILD" == true && ( "$BROWSER_RESULT" != success || "$LIGHTHOUSE_RESULT" != success ) ]]; then
            echo "::error::Selected browser tests and Lighthouse must succeed."
            status=1
          fi
          exit "$status"
