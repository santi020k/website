name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect build-affecting changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_checks=false
          run_full=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_checks=true
            run_full=true
          else
            git diff --no-renames --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r path; do
              case "$path" in
                src/*|public/*|scripts/*|tests/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|astro.config.*|cspell.config.*|eslint.config.*|playwright.config.*|vitest.config.*|tsconfig.json|.lighthouserc*.json|.markdownlint-cli2.*|.npmrc|.changeset/*|.github/*.yml|.github/*.yaml|.github/workflows/*|.github/ISSUE_TEMPLATE/*)
                  run_checks=true
                  run_full=true
                  ;;
                *.md|*.mdx)
                  run_checks=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi

          echo "checks=$run_checks" >> "$GITHUB_OUTPUT"
          echo "full=$run_full" >> "$GITHUB_OUTPUT"

      - name: Run Astro Doctor on the changed code
        if: steps.changes.outputs.full == 'true' && github.event_name == 'pull_request'
        uses: santi020k/astro-doctor@19061e7b586af120b35e31b2aecd4bacaef8f137 # v1
        with:
          comment: 'false'
          diff-only: 'true'
          fail-on: warning

      - name: Set up pnpm workspace
        if: steps.changes.outputs.checks == 'true'
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version: 24.x

      - name: Check documentation
        if: steps.changes.outputs.checks == 'true' && steps.changes.outputs.full != 'true'
        run: pnpm run spellcheck && pnpm run lint:md

      - name: Run static checks and unit tests
        if: steps.changes.outputs.full == 'true'
        run: pnpm run verify:quality

      - name: Audit dependencies
        if: steps.changes.outputs.full == 'true'
        run: pnpm run audit

      - name: Cache pre-rendered OG images
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/og
          key: >-
            og-${{ runner.os }}-${{ hashFiles('src/content/**/*.md', 'src/content/**/*.mdx', 'scripts/js/generate-og-images.js', 'scripts/js/og-render-worker.mjs', 'src/utils/render-social-image.js', 'public/fonts/Montserrat-Regular.ttf', 'public/fonts/Montserrat-ExtraBold.ttf', 'public/logos/logo.webp') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Cache Astro image transformations
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.astro
          key: >-
            astro-images-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.*', 'src/assets/**') }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-

      - name: Build production site
        if: steps.changes.outputs.full == 'true'
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true

      - name: Cache Playwright browser
        if: steps.changes.outputs.full == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium browser
        if: steps.changes.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.changes.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run stable browser tests
        if: steps.changes.outputs.full == 'true'
        run: pnpm run test:e2e:ci:stable

      - name: Run Lighthouse assertions
        if: steps.changes.outputs.full == 'true'
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
