name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect build-affecting changes
        id: changes
        run: node scripts/js/ci-scope.mjs
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Run Astro Doctor on the changed code
        if: steps.changes.outputs.full == 'true' && github.event_name == 'pull_request'
        uses: santi020k/astro-doctor@ada77ece2296778b4c9a84b26229bd0c9e52c83f # v1
        with:
          comment: 'false'
          diff-only: 'true'
          fail-on: warning

      - name: Set up pnpm workspace
        if: steps.changes.outputs.checks == 'true'
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version: 24.x

      - name: Check documentation
        if: steps.changes.outputs.checks == 'true' && steps.changes.outputs.full != 'true'
        run: pnpm run test:ci && pnpm run spellcheck && pnpm run lint:md

      - name: Run static checks and unit tests
        if: steps.changes.outputs.full == 'true'
        run: pnpm run ci:check
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Catch accidental local-time getters and parsing behind UTC.
          TZ: America/Bogota

      - name: Audit dependencies
        if: steps.changes.outputs.full == 'true'
        run: pnpm run audit

      - name: Cache pre-rendered OG images
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            public/og
            .og-cache.json
          key: >-
            og-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'src/content/**', 'src/assets/**', 'src/utils/content-date.ts', 'src/utils/pagination.ts', 'scripts/js/generate-og-images.js', 'scripts/js/prepare-og-image.mjs', 'scripts/js/render-og-atmosphere.mjs', 'public/fonts/montserrat-variable-font-wght.ttf') }}
          restore-keys: |
            og-v2-${{ runner.os }}-

      - name: Cache Astro image transformations
        if: steps.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules/.astro
            apps/*/node_modules/.astro
          key: >-
            astro-images-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.*', 'src/assets/**', 'apps/*/astro.config.*', 'apps/*/src/assets/**', 'packages/website-history/**') }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-

      - name: Build production site
        if: steps.changes.outputs.full == 'true'
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
          # Browser tests must also exercise builds ahead of UTC.
          TZ: Asia/Tokyo

      - name: Cache Playwright browser
        if: steps.changes.outputs.full == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium browser
        if: steps.changes.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.changes.outputs.full == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run stable browser tests
        if: steps.changes.outputs.full == 'true'
        run: pnpm run test:e2e:ci:stable

      - name: Run Lighthouse assertions
        if: steps.changes.outputs.full == 'true'
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
