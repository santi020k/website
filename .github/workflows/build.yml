name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect build-affecting changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          should_run=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            should_run=true
          else
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r path; do
              case "$path" in
                src/*|public/*|scripts/*|tests/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|astro.config.*|eslint.config.*|playwright.config.*|tsconfig.json|.lighthouserc*.json|.github/workflows/build.yml)
                  should_run=true
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi

          echo "run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.changes.outputs.run == 'true'
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: javascript-typescript

      - name: Run Astro Doctor on the changed code
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: santi020k/astro-doctor@15c01314c0601c88fb087946f9238f018e76589c # v1
        with:
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          diff-only: 'true'
          fail-on: warning

      - name: Set up pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run static checks and unit tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm run verify:quality

      - name: Audit dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm run audit

      - name: Cache pre-rendered OG images
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/og
          key: >-
            og-${{ runner.os }}-${{ hashFiles('src/content/**/*.md', 'src/content/**/*.mdx', 'scripts/js/generate-og-images.js', 'scripts/js/og-render-worker.mjs', 'src/utils/render-social-image.js', 'public/fonts/Montserrat-Regular.ttf', 'public/fonts/Montserrat-ExtraBold.ttf', 'public/logos/logo.webp') }}
          restore-keys: |
            og-${{ runner.os }}-

      - name: Build production site
        if: steps.changes.outputs.run == 'true'
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true

      - name: Cache Playwright browser
        if: steps.changes.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium browser
        if: steps.changes.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.changes.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run stable browser tests
        if: steps.changes.outputs.run == 'true'
        run: pnpm run test:e2e:ci:stable

      - name: Run Lighthouse assertions
        if: steps.changes.outputs.run == 'true'
        run: pnpm exec lhci autorun --config=.lighthouserc.json

      - name: Analyze source with CodeQL
        if: steps.changes.outputs.run == 'true'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: /language:javascript-typescript

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
