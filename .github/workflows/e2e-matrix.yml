name: E2E Matrix (Manual/Nightly)

'on':
  workflow_dispatch: {}

jobs:
  e2e-matrix:
    name: Cross-browser E2E matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1.3.0
        with:
          node-version: "24.x"
      - name: Cache pre-rendered OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/og
          key: >-
            og-${{ runner.os }}-${{ hashFiles('src/content/**/*.md', 'src/content/**/*.mdx', 'scripts/js/generate-og-images.js', 'scripts/js/og-render-worker.mjs', 'src/utils/render-social-image.js', 'public/fonts/Montserrat-Regular.ttf', 'public/fonts/Montserrat-ExtraBold.ttf', 'public/logos/logo.webp') }}
          restore-keys: |
            og-${{ runner.os }}-
      - name: Cache Astro image transformations
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules/.astro
          key: >-
            astro-images-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'astro.config.*', 'src/assets/**') }}
          restore-keys: |
            astro-images-v1-${{ runner.os }}-
      - name: Build
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run full E2E matrix
        run: pnpm run test:e2e:ci
