name: E2E Matrix (Manual/Nightly)

'on':
  workflow_dispatch: {}

jobs:
  e2e-matrix:
    name: Cross-browser E2E matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Cache pre-rendered OG images
        uses: actions/cache@v4
        with:
          path: public/og
          key: >-
            og-${{ runner.os }}-${{ hashFiles('src/content/**/*.md', 'src/content/**/*.mdx', 'scripts/js/generate-og-images.js', 'scripts/js/og-render-worker.mjs', 'src/utils/render-social-image.js', 'public/fonts/Montserrat-Regular.ttf', 'public/fonts/Montserrat-ExtraBold.ttf', 'public/logos/logo.webp') }}
          restore-keys: |
            og-${{ runner.os }}-
      - name: Build
        run: pnpm run build
        env:
          PUBLIC_IS_CI: true
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      - name: Run full E2E matrix
        run: pnpm run test:e2e:ci
