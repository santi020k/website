# yaml-language-server: $schema=https://quality.santi020k.com/quality.schema.json
# quality.yml — one code-quality workflow for this repository
version: 1
output: pretty
baseline: .quality-baseline.json
tools:
  astro-check:
    enabled: true
    check: false
    required: true
  cspell:
    enabled: true
    check: false
    required: true
  eslint:
    enabled: true
    check: false
    required: true
tasks:
  og-images:
    name: Open Graph image check
    command: pnpm
    args:
      - exec
      - santi-og
      - check
      - --config
      - scripts/js/generate-og-images.js
      - --silent
    required: true
    parser: generic
  repository-check:
    name: Repository check (verify:quality)
    command: pnpm
    args:
      - run
      - verify:quality
    required: true
    parser: generic
hooks:
  commit-msg:
    steps:
      - name: Validate commit message
        command: pnpm
        args: [exec, commitprompt, validate, --input]
        pass_hook_args: true
  pre-commit:
    steps:
      - name: Run pre-commit gate
        command: pnpm
        args: [run, pre-commit]
  pre-push:
    steps:
      - name: Run fast verification
        command: pnpm
        args: [run, pre-push]
