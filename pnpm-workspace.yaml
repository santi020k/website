  "@lhci/cli>tmp": 0.2.7
  "@lhci/cli>uuid": 11.1.1
  "@lhci/cli>proxy-agent": 8.0.2
  # Lighthouse CI only asks this launcher for installed Chrome paths; 0.15 drops rimraf 3 and glob 7.
  "@lhci/cli>chrome-launcher": 0.15.2
  "@lhci/utils>js-yaml": 4.3.2
  basic-ftp@<6.2.2: 6.2.2
  "@graphql-tools/utils@<12.0.3": 12.0.3
  katex@<0.18.2: 0.18.2
  postcss-selector-parser@<7.1.6: 7.1.6
