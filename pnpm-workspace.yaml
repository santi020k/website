allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
auditConfig:
  ignoreCves:
    # No patched extract-zip release exists; exposure is limited to Lighthouse's
    # development-only Chromium downloader and CI installs trusted browser artifacts.
    - CVE-2026-56876
catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/markdown-remark": ^7.2.4
  "@astrojs/mdx": 7.0.8
  "@astrojs/rss": 4.0.19
  "@astrojs/sitemap": 3.7.3
  "@astrojs/ts-plugin": ^1.10.11
  "@axe-core/playwright": ^4.13.0
  "@changesets/changelog-github": ^1.0.0
  "@changesets/cli": ^3.0.1
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@iconify-json/tabler": ^1.2.38
  "@lhci/cli": ^0.15.1
  "@playwright/test": ^1.62.1
  "@santi020k/commitprompt": ^1.1.0
  "@santi020k/eslint-config-full": 3.2.2
  "@santi020k/lumen-astro": 1.6.0
  "@santi020k/og": 1.1.1
  "@santi020k/theme": ^1.3.0
  "@shikijs/transformers": ^4.4.3
  "@tailwindcss/typography": ^0.5.20
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@types/js-yaml": ^4.0.9
  "@types/mdast": ^4.0.4
  "@vitest/coverage-v8": ^4.1.11
  "@vitest/ui": ^4.1.11
  astro: 7.2.6
  astro-icon: ^1.2.0
  astro-robots-txt: ^1.0.0
  astro-webmanifest: ^1.0.0
  cspell: ^10.1.0
  eslint: ^10.9.0
  fast-xml-parser: ^5.11.0
  hastscript: ^9.0.1
  js-yaml: ^5.3.0
  jsdom: ^30.0.1
  lint-staged: ^17.3.0
  markdownlint-cli2: ^0.23.2
  mdast-util-directive: ^3.1.0
  mdast-util-to-markdown: ^2.1.2
  mdast-util-to-string: ^4.0.0
  npm-run-all2: ^9.0.3
  reading-time: ^1.5.0
  rehype-external-links: ^3.0.0
  rehype-pretty-code: ^0.14.5
  rehype-unwrap-images: ^1.0.0
  remark-directive: ^4.0.0
  remark-parse: ^11.0.0
  remark-stringify: ^11.0.0
  sharp: ^0.35.3
  tailwindcss: ^4.3.3
  # Astro Check and the shared ESLint configuration do not support TypeScript 7 yet.
  typescript: ^6.0.3
  unified: ^11.0.5
  unist-util-visit: ^5.1.0
  vfile: ^6.0.3
  vitest: ^4.1.11
  wawoff2: ^2.0.1
minimumReleaseAgeExclude:
  - "@santi020k/og"
  - "@santi020k/lumen-astro@1.6.0"
  - "@santi020k/lumen-core@1.4.0"
  - "@santi020k/lumen@1.6.0"
  - "@santi020k/eslint-config-typescript"
overrides:
  # Keep legacy build and release tooling on patched transitive versions until
  # their direct dependencies adopt these releases.
  "@lhci/cli>lighthouse": 13.4.1
  "@lhci/utils>lighthouse": 13.4.1
  "@lhci/cli>tmp": 0.2.7
  "@lhci/cli>uuid": 11.1.1
  "@lhci/utils>js-yaml": 3.15.1
  astro-webmanifest>sharp: 0.35.3
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  brace-expansion@>=4.0.0 <5.0.9: 5.0.9
  external-editor>tmp: 0.2.7
  fast-uri@>=3.0.0 <3.1.5: 3.1.5
  ip-address@<=10.3.0: 10.3.1
  markdownlint-cli2>js-yaml: 4.3.1
  markdownlint-cli2>markdown-it: 14.3.0
  nanoid@<3.3.18: 3.3.18
  read-yaml-file>js-yaml: 3.15.1
  undici@>=7.0.0 <7.29.0: 7.29.0
  yaml-language-server>yaml: 2.9.0
